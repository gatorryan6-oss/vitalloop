[pytest]
# pytest's default scratch base (%LOCALAPPDATA%\Temp\pytest-of-<user>) is
# ACL-locked on this machine by an older project, and tmp_path then fails
# with WinError 5 before a single test runs. Keep scratch dirs inside the
# repo instead — .pytest_tmp/ has been gitignored since M0, which is what
# the standing kit expected all along. Plain
# `python -m pytest tests/test_invariants.py -q` must work with no flags.
addopts = --basetemp=.pytest_tmp
